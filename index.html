<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f5f9f">
<title>VK Endereçamento</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>try{document.documentElement.dataset.tema=localStorage.getItem("end_tema")||"industrial";}catch(e){document.documentElement.dataset.tema="industrial";}</script>
<style>
/* =====================================================================
   VK Endereçamento — sistema de design (um único bloco de estilos)
   1 tokens/temas · 2 base · 3 estrutura (topo, menu, páginas) · 4 componentes
   5 telas · 6 tabelas · 7 janelas e avisos · 8 celular
   ===================================================================== */
/* ---------- 1. tokens e temas ---------- */
:root{--bg:#101318;--surface:#181C23;--surface-alt:#1F242D;--ink:#F2EFE9;--ink-soft:#98A0AC;--line:#2A303A;--amber:#FF7A45;--amber-deep:#E85A28;--amber-pale:rgba(255,122,69,.15);--sage:#5FBF7A;--sage-pale:rgba(95,191,122,.15);--danger:#EE5B50;--danger-pale:rgba(238,91,80,.15);--warn:#F2B03D;--warn-pale:rgba(242,176,61,.15);--info:#6AA9FF;--info-pale:rgba(106,169,255,.15);--topo:#14171D;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px -16px rgba(0,0,0,.7);--r:14px;--r-sm:10px;--f:Outfit,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
html[data-tema="industrial"]{--bg:#101318;--surface:#181C23;--surface-alt:#1F242D;--ink:#F2EFE9;--ink-soft:#98A0AC;--line:#2A303A;--amber:#FF7A45;--amber-deep:#E85A28;--amber-pale:rgba(255,122,69,.15);--sage:#5FBF7A;--sage-pale:rgba(95,191,122,.15);--danger:#EE5B50;--danger-pale:rgba(238,91,80,.15);--warn:#F2B03D;--warn-pale:rgba(242,176,61,.15);--info:#6AA9FF;--info-pale:rgba(106,169,255,.15);--topo:#14171D;}
html[data-tema="grafite"]{--bg:#1c1f26;--surface:#262a33;--surface-alt:#303541;--ink:#eceff4;--ink-soft:#9aa3b2;--line:#3a4050;--amber:#38bdf8;--amber-deep:#0ea5e9;--amber-pale:rgba(56,189,248,.16);--sage:#4ade80;--sage-pale:rgba(74,222,128,.15);--danger:#f87171;--danger-pale:rgba(248,113,113,.16);--warn:#fbbf24;--warn-pale:rgba(251,191,36,.15);--info:#93c5fd;--info-pale:rgba(147,197,253,.16);--topo:#20232b;}
html[data-tema="claro"],html[data-tema="azul"],html[data-tema="verde"],html[data-tema="roxo"]{--sh:0 1px 2px rgba(20,30,50,.06),0 10px 26px -18px rgba(20,30,50,.35);--topo:#ffffff;--danger:#d92d20;--danger-pale:rgba(217,45,32,.1);--warn:#b45309;--warn-pale:rgba(217,119,6,.14);--info:#1d4ed8;--info-pale:rgba(29,78,216,.1);}
html[data-tema="claro"]{--bg:#f4f2ec;--surface:#fff;--surface-alt:#f1eee6;--ink:#1d1d1d;--ink-soft:#6b6558;--line:#e3dfd4;--amber:#d97706;--amber-deep:#c2610a;--amber-pale:rgba(217,119,6,.13);--sage:#16803c;--sage-pale:rgba(22,163,74,.12);}
html[data-tema="azul"]{--bg:#edf3fb;--surface:#fff;--surface-alt:#e5edf8;--ink:#14253a;--ink-soft:#587089;--line:#d3e0ee;--amber:#2563eb;--amber-deep:#1d4ed8;--amber-pale:rgba(37,99,235,.12);--sage:#16803c;--sage-pale:rgba(22,163,74,.12);}
html[data-tema="verde"]{--bg:#eef5ef;--surface:#fff;--surface-alt:#e3eee5;--ink:#16281c;--ink-soft:#587060;--line:#cfe0d3;--amber:#15803d;--amber-deep:#166534;--amber-pale:rgba(21,128,61,.12);--sage:#15803d;--sage-pale:rgba(21,128,61,.12);}
html[data-tema="roxo"]{--bg:#f3f0fa;--surface:#fff;--surface-alt:#ebe5f6;--ink:#241a3a;--ink-soft:#6b5f87;--line:#dcd3ee;--amber:#7c3aed;--amber-deep:#6d28d9;--amber-pale:rgba(124,58,237,.12);--sage:#16803c;--sage-pale:rgba(22,163,74,.12);}
/* ---------- 2. base ---------- */
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background:radial-gradient(1100px 480px at 88% -8%,var(--amber-pale),transparent 62%),var(--bg);background-attachment:fixed;min-height:100vh;}
h1,h2,h3{font-family:inherit;letter-spacing:-.01em;margin:0;}
button{font-family:inherit;}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;} .muted{color:var(--ink-soft);} .sub{color:var(--ink-soft);font-size:13px;margin:4px 0;line-height:1.45;}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;display:inline-block;} .ico svg{width:100%;height:100%;display:block;}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.35em;vertical-align:.05em;background:var(--ink-soft);} .dot.bad{background:var(--danger);} .dot.warn{background:var(--warn);} .dot.ok{background:var(--sage);}
.section-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:22px 2px 8px;}
.ins-grupo{font-weight:800;margin:20px 0 6px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;} .cp-head-sub{color:var(--ink-soft);font-size:13px;}
/* ---------- 3. estrutura: acesso, topo, menu lateral, cabeçalho de página ---------- */
#login{max-width:400px;margin:11vh auto;padding:0 16px;} #app{display:none;}
.login-card{padding:26px!important;} .login-brand{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.topo{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--topo);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);}
.brand{display:flex;align-items:center;gap:12px;min-width:0;} .brand-t{min-width:0;} .brand-t b{display:block;font-size:17px;font-weight:800;line-height:1.15;} .brand-t small{display:block;color:var(--ink-soft);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:.02em;color:#fff;background:linear-gradient(180deg,#4a7bbd,#2c5a9a);box-shadow:0 6px 18px -8px rgba(44,90,154,.9),inset 0 1px 0 rgba(255,255,255,.25);flex:none;}
.esp{flex:1;} .ibtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface-alt);color:var(--ink);display:grid;place-items:center;cursor:pointer;} .ibtn:hover{border-color:var(--amber);color:var(--amber);}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;max-width:1500px;margin:0 auto;padding:20px 22px 48px;}
.side{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:3px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);}
.nav-g{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:14px 10px 5px;} .nav-g:first-child{margin-top:4px;}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;border:0;background:none;color:var(--ink-soft);font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;position:relative;transition:background .15s,color .15s;}
.nav-i .ico{font-size:19px;} .nav-i:hover{background:var(--surface-alt);color:var(--ink);} .nav-i.on{background:var(--amber-pale);color:var(--ink);} .nav-i.on .ico{color:var(--amber);} .nav-i.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--amber);box-shadow:0 0 14px var(--amber);}
.nav-i .bdg{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;}
.content{min-width:0;}
.pg-head{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 18px;} .pg-title{display:flex;gap:14px;align-items:center;min-width:0;}
.pg-ic{width:46px;height:46px;border-radius:13px;background:var(--amber-pale);color:var(--amber);display:grid;place-items:center;flex:none;} .pg-ic .ico{font-size:23px;}
.pg-title h1{font-size:22px;font-weight:800;line-height:1.15;} .pg-title p{margin:3px 0 0;color:var(--ink-soft);font-size:13.5px;} .pg-act{display:flex;gap:8px;flex-wrap:wrap;}
.bnav{display:none;}
/* ---------- 4. componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh);}
.card h2{font-size:17px;font-weight:800;} .card h3{font-size:15px;font-weight:800;} .card.flat{box-shadow:none;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;} .card-h h2,.card-h h3{display:flex;align-items:center;gap:9px;} .card-h .ico{color:var(--amber);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#fff;border:0;border-radius:11px;padding:11px 17px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 8px 20px -12px var(--amber-deep),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .15s,transform .05s,box-shadow .15s;}
.btn:hover{filter:brightness(1.08);} .btn:active{transform:translateY(1px);} .btn:disabled{opacity:.5;cursor:default;filter:none;}
.btn.secondary{background:var(--surface-alt);color:var(--ink);border:1px solid var(--line);box-shadow:none;} .btn.secondary:hover{border-color:var(--amber);filter:none;} .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
.btn.grande{width:100%;padding:15px 18px;font-size:16px;border-radius:13px;}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-alt);color:var(--ink-soft);white-space:nowrap;} .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.tag.ok{background:var(--sage-pale);color:var(--sage);} .tag.bad{background:var(--danger-pale);color:var(--danger);} .tag.warn{background:var(--warn-pale);color:var(--warn);} .tag.info{background:var(--info-pale);color:var(--info);}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-alt);color:var(--ink);font:inherit;margin:0;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-pale);} input::placeholder{color:var(--ink-soft);opacity:.8;} input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--amber-deep);} textarea{resize:vertical;}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;letter-spacing:.02em;}
.fld{min-width:0;} .fld label:first-child{margin-top:0;}
.end-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;} .end-grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;} .end-grade2>div{min-width:0;} .end-grade2 label{margin-top:0;}
.end-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;} .end-chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;} .end-chip:hover{border-color:var(--amber);} .end-chip.on{background:var(--amber-deep);color:#fff;border-color:transparent;}
.busca{position:relative;margin-bottom:12px;} .busca .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:18px;pointer-events:none;} .busca input{padding-left:42px;height:46px;border-radius:12px;}
.meter{height:8px;border-radius:99px;background:var(--surface-alt);overflow:hidden;} .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber-deep),var(--amber));} .meter.ok i{background:var(--sage);} .meter.warn i{background:var(--warn);} .meter.bad i{background:var(--danger);}
.sbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-alt);gap:2px;} .sbar i{display:block;height:100%;min-width:4px;} .sbar i:first-child{border-radius:99px 0 0 99px;} .sbar i:last-child{border-radius:0 99px 99px 0;}
.c-ok{background:var(--sage);} .c-info{background:var(--info);} .c-warn{background:var(--warn);} .c-bad{background:var(--danger);} .c-mut{background:var(--ink-soft);}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px;} .leg div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);} .leg b{color:var(--ink);margin-left:auto;} .leg i{width:10px;height:10px;border-radius:3px;flex:none;}
.vazio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 18px;color:var(--ink-soft);} .vazio .vi{width:54px;height:54px;border-radius:16px;background:var(--surface-alt);display:grid;place-items:center;color:var(--ink-soft);} .vazio .vi .ico{font-size:26px;} .vazio b{color:var(--ink);font-size:15px;} .vazio p{margin:0;font-size:13px;max-width:360px;}
.skel{border-radius:12px;background:linear-gradient(90deg,var(--surface-alt) 25%,var(--surface) 50%,var(--surface-alt) 75%);background-size:200% 100%;animation:sk 1.3s infinite;} @keyframes sk{to{background-position:-200% 0;}}
.end-lin{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;} .end-lin:last-child{border-bottom:0;} .end-lin small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:3px;}
.end-pick{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid var(--amber);border-radius:12px;background:var(--amber-pale);} .end-pick small{display:block;margin-top:3px;color:var(--ink-soft);font-size:12.5px;}
.end-res{border:1px solid var(--line);border-radius:12px;max-height:270px;overflow:auto;margin-top:6px;background:var(--surface);box-shadow:var(--sh);} .end-res button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer;} .end-res button:hover{background:var(--amber-pale);} .end-res small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.pickrow{display:flex;gap:8px;} .pickrow input{flex:1;}
.end-det{margin:12px 0;background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;padding:2px 14px;} .end-det summary{cursor:pointer;font-weight:700;padding:12px 0;}
.sw{appearance:none;-webkit-appearance:none;width:44px!important;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0!important;border:0;padding:0;} .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.4);} .sw:checked{background:var(--amber-deep);} .sw:checked::after{transform:translateX(18px);}
.cfg-row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);margin:0;cursor:pointer;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:0;} .cfg-row:last-child{border-bottom:0;} .cfg-row small{display:block;color:var(--ink-soft);font-weight:500;font-size:12.5px;margin-top:3px;line-height:1.4;}
/* ---------- 5. telas ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px;}
.kpi-c{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:border-color .15s,transform .15s;} .kpi-c:hover{border-color:var(--amber);transform:translateY(-1px);}
.kpi-c .kt{display:flex;align-items:center;justify-content:space-between;color:var(--ink-soft);font-size:13px;font-weight:600;} .kpi-c .ki{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--amber-pale);color:var(--amber);} .kpi-c .ki .ico{font-size:20px;}
.kpi-c .kv{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em;} .kpi-c .kv small{font-size:16px;color:var(--ink-soft);font-weight:700;} .kpi-c .ks{font-size:12.5px;color:var(--ink-soft);min-height:16px;}
.kpi-c.t-ok .ki{background:var(--sage-pale);color:var(--sage);} .kpi-c.t-warn .ki{background:var(--warn-pale);color:var(--warn);} .kpi-c.t-bad .ki{background:var(--danger-pale);color:var(--danger);} .kpi-c.t-bad .kv{color:var(--danger);} .kpi-c.t-warn .kv{color:var(--warn);} .kpi-c.t-info .ki{background:var(--info-pale);color:var(--info);}
.kpi-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px;} .kpi-m{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;text-align:left;cursor:pointer;} .kpi-m:hover{border-color:var(--amber);} .kpi-m .ico{font-size:20px;color:var(--ink-soft);} .kpi-m b{display:block;font-size:20px;line-height:1.1;} .kpi-m span{font-size:12px;color:var(--ink-soft);}
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start;} .dash .card{margin-bottom:16px;}
.al{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line);} .al:last-child{border-bottom:0;} .al .ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;} .al .ai.bad{background:var(--danger-pale);color:var(--danger);} .al .ai.warn{background:var(--warn-pale);color:var(--warn);} .al .ai.ok{background:var(--sage-pale);color:var(--sage);} .al .ai .ico{font-size:17px;} .al div{flex:1;min-width:0;font-size:14px;line-height:1.4;} .al small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px;}
.stp{display:flex;margin:0 0 18px;overflow-x:auto;padding-bottom:2px;} .stp>div{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center;} .stp>div::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;} .stp>div:first-child::before{display:none;}
.stp b{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-alt);border:2px solid var(--line);font-size:13px;color:var(--ink-soft);} .stp .ico{font-size:16px;}
.stp .ok b{background:var(--sage);border-color:var(--sage);color:#fff;} .stp .ok::before,.stp .cur::before{background:var(--sage);} .stp .ok{color:var(--ink);} .stp .cur b{border-color:var(--amber);background:var(--amber-pale);color:var(--amber);box-shadow:0 0 0 4px var(--amber-pale);} .stp .cur{color:var(--ink);}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start;} .stick{position:sticky;top:78px;}
.etapa{display:flex;gap:14px;} .etapa+.etapa{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);} .etapa .n{width:28px;height:28px;border-radius:50%;background:var(--amber-pale);color:var(--amber);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;margin-top:1px;} .etapa .eb{flex:1;min-width:0;} .etapa h3{margin-bottom:2px;}
.rs-l{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;} .rs-l span{color:var(--ink-soft);} .rs-l b{text-align:right;} .rs-l:last-of-type{border-bottom:0;}

    raiz.appendChild(ov); let stream = null, parar = false;
    const fechar = ()=>{ parar = true; try{ stream && stream.getTracks().forEach(t=>t.stop()); }catch(e){} ov.remove(); };
    const entregar = v=>{ fechar(); cb(String(v).trim()); };

  async function endRegistrarHig(){

    const alvos = (END.f.higAlvos && END.f.higAlvos.length ? END.f.higAlvos : (END.f.higUm ? [END.f.higUm] : [])).map(endBalde).filter(Boolean);
    if(!alvos.length){ endAlerta("Escolha pelo menos um balde.", "erro"); return; }
    if(!quando){ endAlerta("Informe a data e o horário da limpeza.", "erro"); return; }
    if(new Date(quando).getTime() > Date.now() + 60000){ endAlerta("A data da limpeza não pode ser no futuro: só registre depois de concluída.", "erro"); return; }
    if(!resp){ endAlerta("Informe quem fez a limpeza.", "erro"); return; }
    if(!document.getElementById("hg-ok")?.checked){ endAlerta("Marque a confirmação de que a limpeza foi concluída.", "erro"); return; }
    const dados = { quando, responsavel:resp, tipoLimpeza:v("hg-tipo"), metodo:v("hg-metodo"), produtos:v("hg-prod"), obs:v("hg-obs") }; END.f.hgResp = resp;

    for(const b of alvos){
      const opId = (END.opHig && END.opHig[b.id]) || (END.opHig = END.opHig || {}, END.opHig[b.id] = endOp());
      try{
        await db.runTransaction(async tx=>{
          const ms = await tx.get(COL_END_MOV.doc(opId)); if(ms.exists) return;
          const br = COL_END_BALDES.doc(b.id), bs = await tx.get(br); if(!bs.exists) throw new Error("balde não existe mais"); const bd = bs.data();
          if(bd.ativo === false) throw new Error(`${bd.codigo} está inativo`);
          if(Object.values(bd.insumos || {}).some(x=>x > 1e-7)) throw new Error(`${bd.codigo} ainda tem material dentro — retire antes de higienizar`);

        });

      ${sec("shield", "Permissões", "Quem pode fazer o quê. O administrador sempre pode tudo.", `<div class="end-scroll" style="margin:0 -20px -18px;"><table class="end-tab-r"><thead><tr><th>Ação</th>${END_FUNCOES.map(f=>`<th>${endEsc((FUNCOES_ACESSO[f]||{}).nome || f)}</th>`).join("")}</tr></thead><tbody>${Object.keys(END_ACOES).map(a=>{ const marc = c.permissoes[a] || END_PERM_PADRAO[a]; return `<tr><td>${endEsc(END_ACOES[a])}</td>${END_FUNCOES.map(f=>`<td><input type="checkbox" data-end-perm="${a}|${f}" ${marc.includes(f) ? "checked" : ""}></td>`).join("")}</tr>`; }).join("")}</tbody></table></div>`)}
      <button type="button" class="btn grande" data-end-x="salvar-config">💾 Salvar regras</button>`;
  }
  async function endSalvarConfig(incompatNovo){
    if(!endPode("config")){ endAlerta("Sem permissão para configurar.", "erro"); return; }
    const c = endCfg(); const num = (id, pad, min)=>{ const v = parseInt(document.getElementById(id)?.value, 10); return v >= min ? v : pad; };
    const linhas = id=>(document.getElementById(id)?.value || "").split(/\n/).map(x=>x.trim()).filter(Boolean);
    const porTipo = {}; document.querySelectorAll("#end-raiz [data-end-cf-tipo]").forEach(i=>{ const v = parseInt(i.value, 10); if(v > 0) porTipo[i.dataset.endCfTipo] = v; });
    const perm = {}; Object.keys(END_ACOES).forEach(a=>{ perm[a] = END_FUNCOES.filter(f=>document.querySelector(`#end-raiz [data-end-perm="${a}|${f}"]`)?.checked); });
    const novo = { intervaloDias:num("cf-int", 15, 1), alertaDias:num("cf-alerta", 3, 0), alertaValidadeDias:num("cf-val", 30, 0), numeroInicial:num("cf-ini", 1, 1), exigirLimpezaReuso:!!document.getElementById("cf-reuso")?.checked, exigirLimpezaInicial:!!document.getElementById("cf-ini2")?.checked, porTipo,
      misturaPermitida:!!document.getElementById("cf-mist")?.checked, lotesDiferentes:!!document.getElementById("cf-lotes")?.checked, incompat:incompatNovo || c.incompat, tipos:linhas("cf-tipos").length ? linhas("cf-tipos") : c.tipos, tiposLocal:linhas("cf-tlocal").length ? linhas("cf-tlocal") : c.tiposLocal, tiposLimpeza:linhas("cf-tlimp").length ? linhas("cf-tlimp") : c.tiposLimpeza, permissoes:perm, atualizadoEm:new Date().toISOString(), atualizadoPor:usuarioLogadoEmail || "" };
    try{ await COL_END_CFG.doc("geral").set(novo); END.cfg = novo; registrarLog("Endereçamento: regras alteradas", ""); endRender(); endAlerta("Regras salvas.", "ok"); }
    catch(e){ console.error(e); endAlerta("Não consegui salvar as regras. Verifique a internet e as regras do Firestore.", "erro"); }
  }
  // ---------- eventos ----------
  function endRenderFoco(id){ endRender(); const el = document.getElementById(id); if(el){ el.focus(); try{ const n = el.value.length; el.setSelectionRange(n, n); }catch(e){} } }
  const END_PICK = { ins:"insumoId", bal:"baldeId", rbal:"rBalde", rdest:"rDestBalde", cbal:"cBalde" };
  function endAplicarPick(id, valor){
    if(id === "hr"){ END.f.higAlvos = (END.f.higAlvos || []).filter(x=>x !== valor).concat(valor); return; }
    END.f[END_PICK[id]] = valor; if(id === "rbal"){ END.f.rCont = ""; END.f.rQtd = ""; }
    if(id === "ins" && valor){ END.f.marca = END.f.marca || "";
      if(END.f.barraPend){ const c = END.f.barraPend; END.f.barraPend = ""; endSalvarBarra(c, valor).then(()=>endAlerta("Pronto: esse código de barras agora é deste insumo.", "ok")).catch(()=>endAlerta("Não consegui guardar o código de barras. Tente de novo.", "erro")); } }
  }
  function endClique(e){
    const t = e.target, g = sel=>t.closest(sel);
    let el;
    if((el = g("[data-end-tela]"))){ const al0 = document.getElementById("end-alerta"); if(al0) al0.style.display = "none"; END.tela = el.dataset.endTela; END.sel = null; END.sub = ""; END.f.localEd = null; END.f.localVer = null; END.f.baldeNovo = null; END.filtro = { sit:"", loc:"", q:"" }; return endRender(); }
    if((el = g("[data-end-ir]"))){ let f = {}; try{ f = JSON.parse(el.dataset.endFiltro || "{}"); }catch(_){} if(f.hoje) END.filtro.hoje = 1; else END.filtro = Object.assign({ sit:"", loc:"", q:"" }, f); return endIr(el.dataset.endIr, null, el.dataset.endSub || f.sub || ""), (f.sit !== undefined ? (END.filtro = Object.assign({ sit:"", loc:"", q:"" }, f), endRender()) : 0); }
    if((el = g("[data-end-sub]"))){ END.sub = el.dataset.endSub; if(END.tela === "consulta" && END.sub !== "hist") END.filtro.hoje = 0; return endRender(); }
    if((el = g("[data-end-fsit]"))){ END.filtro.sit = el.dataset.endFsit; return endRender(); }
    if((el = g("[data-end-abrir-balde]"))){ END.tela = "baldes"; END.sel = el.dataset.endAbrirBalde; END.f.mudarLocal = null; END.f.higUm = null; endRender(); return window.scrollTo({ top:0 }); }
    if((el = g("[data-end-modo]"))){ END.f.rDest = el.dataset.endModo; return endRender(); }
    if((el = g("[data-end-pick]"))){ const [id, v] = el.dataset.endPick.split("|"); endAplicarPick(id, v); return endRender(); }
    if((el = g("[data-end-limpar]"))){ const id = el.dataset.endLimpar; END.f[END_PICK[id]] = ""; if(id === "rbal"){ END.f.rCont = ""; END.f.rQtd = ""; } return endRender(); }
    if((el = g("[data-end-scan]"))){ const id = el.dataset.endScan; return endEscanear(cod=>{ if(id === "ins"){ endEntradaBarraInsumo(cod); return; } const b = endContPorCodigo(cod); if(!b){ endAlerta(`Não achei nenhum balde ou local com o código "${cod}".`, "erro"); return; } endAplicarPick(id, b.id); endRender(); }); }
    if((el = g("[data-end-det]"))){ END.f.consDet = el.dataset.endDet; return endRender(); }
    if((el = g("[data-end-cq]"))){ END.f.cq = el.dataset.endCq; END.f.consDet = null; return endRender(); }
    if((el = g("[data-end-rel]"))){ END.rel = el.dataset.endRel; END.f.rq = ""; return endRender(); }
    if((el = g("[data-end-extrato]"))){ const al1 = document.getElementById("end-alerta"); if(al1) al1.style.display = "none"; const [tp, id] = el.dataset.endExtrato.split("|"); END.f.extrato = { tipo:tp, id, de:"", ate:"" }; endRender(); return window.scrollTo({ top:0 }); }
    if((el = g("[data-end-ver-local]"))){ END.f.localVer = el.dataset.endVerLocal; return endRender(); }
    if((el = g("[data-end-edit-local]"))){ END.f.localEd = el.dataset.endEditLocal; return endRender(); }
    if((el = g("[data-end-exc-local]"))) return endExcluirLocal(el.dataset.endExcLocal);
    if((el = g("[data-end-etiq-um]"))) return endImprimirEtiquetas([el.dataset.endEtiqUm]);
    if((el = g("[data-end-hig-um]"))){ END.f.higUm = el.dataset.endHigUm; END.f.higAlvos = []; return endRender(); }
    if((el = g("[data-end-edit-balde]"))){ END.f.baldeNovo = el.dataset.endEditBalde; END.sel = null; return endRender(); }
    if((el = g("[data-end-mudar-local]"))){ END.f.mudarLocal = el.dataset.endMudarLocal; return endRender(); }
    if((el = g("[data-end-bloq]"))){ const [id, ac] = el.dataset.endBloq.split("|"); return endStatusBalde(id, ac); }
    if((el = g("[data-end-exc-balde]"))) return endExcluirBalde(el.dataset.endExcBalde);
    if((el = g("[data-end-estornar-hig]"))) return endEstornarHig(el.dataset.endEstornarHig);
    if((el = g("[data-end-hr-rem]"))){ END.f.higAlvos = (END.f.higAlvos || []).filter(x=>x !== el.dataset.endHrRem); return endRender(); }
    if((el = g("[data-end-cf-increm]"))){ const c = endCfg(); return endSalvarConfig(c.incompat.filter((_, i)=>i !== +el.dataset.endCfIncrem)); }
    if((el = g("[data-end-x]"))){
      const a = el.dataset.endX;
      if(a === "alerta"){ document.getElementById("end-alerta").style.display = "none"; return; }
      if(a === "recarregar"){ END.erroCarga = false; return endRecarregar(); }
      if(a === "novo-local"){ END.f.localEd = "novo"; return endRender(); } if(a === "salvar-local") return endSalvarLocal(); if(a === "cancelar-local"){ END.f.localEd = null; return endRender(); } if(a === "fechar-local"){ END.f.localVer = null; return endRender(); }
      if(a === "novo-balde"){ END.f.baldeNovo = "novo"; return endRender(); } if(a === "salvar-balde") return endSalvarBalde(); if(a === "cancelar-balde"){ END.f.baldeNovo = null; return endRender(); } if(a === "voltar-baldes"){ END.sel = null; return endRender(); }
      if(a === "etiq-sel"){ let ids = Object.keys(END.selEtiq).filter(k=>END.selEtiq[k]); if(!ids.length) ids = endFiltrarBaldes().slice(0, 60).map(b=>b.id); return endImprimirEtiquetas(ids); }
      if(a === "scan-abrir-balde") return endEscanear(cod=>{ const b = endBaldePorCodigo(cod); if(!b){ endAlerta(`Não achei nenhum balde com o código "${cod}".`, "erro"); return; } END.sel = b.id; endRender(); });
      if(a === "confirmar-enderecar") return endConfirmarEnderecar(); if(a === "confirmar-retirar") return endConfirmarRetirar();
      if(a === "retirar-tudo"){ const c = END.cont.find(x=>x.id === END.f.rCont); if(c){ END.f.rQtd = String(c.quantidade).replace(".", ","); endRender(); } return; }
      if(a === "confirmar-local-balde") return endMudarLocalBalde(END.f.mudarLocal);
      if(a === "confirmar-hig"){ if(END.tela === "baldes" && END.f.higUm) END.f.higAlvos = []; return endRegistrarHig(); }
      if(a === "hr-add"){ const b = endBaldePorCodigo(document.getElementById("hr-cod")?.value); if(!b){ endAlerta("Código de balde não encontrado.", "erro"); return; } endAplicarPick("hr", b.id); return endRender(); }
      if(a === "cf-incompat"){ const A = document.getElementById("cf-ia").value, B = document.getElementById("cf-ib").value; if(!A || !B || A === B){ endAlerta("Escolha duas categorias diferentes.", "erro"); return; } return endSalvarConfig(endCfg().incompat.concat([{ a:A, b:B }])); }
      if(a === "salvar-config") return endSalvarConfig();
      if(a === "ext-fechar"){ END.f.extrato = null; return endRender(); } if(a === "ext-imprimir") return endImprimirTabela(endExtratoTabela()); if(a === "ext-csv") return endBaixarCsv(endExtratoTabela());
      if(a === "rel-imprimir") return endImprimirTabela(endRelAtual()); if(a === "rel-csv") return endBaixarCsv(endRelAtual());
      if(a === "fechar-det"){ END.f.consDet = null; return endRender(); }
    }
  }
  function endTeclaEnter(e){
    if(e.key !== "Enter") return; const t = e.target;
    if(t.id === "hr-cod"){ e.preventDefault(); return document.querySelector('#end-raiz [data-end-x="hr-add"]')?.click(); }
    if(t.dataset && t.dataset.endPq){ e.preventDefault(); const id = t.dataset.endPq; if(id === "ins"){ const v = endNormBarra(t.value); if(endInsumoPorBarra(v) || /^\d{6,}$/.test(v)) endEntradaBarraInsumo(v); return; }
      const b = endContPorCodigo(t.value); if(b){ endAplicarPick(id, b.id); return endRender(); }
      const prim = document.querySelector(`#end-raiz [data-end-res="${id}"] [data-end-pick]`); if(prim) prim.click(); else endAlerta(`Não achei nenhum balde com o código "${t.value}".`, "erro"); }
  }
  function endInput(e){
    const t = e.target, id = t.id || ""; const ev = e.type;
    if(t.dataset && t.dataset.endPq !== undefined){ if(ev === "input") endBuscaPicker(t.dataset.endPq, t.value); return; }
    if(t.dataset && t.dataset.endEtq){ END.selEtiq[t.dataset.endEtq] = t.checked; return; }
    if(t.dataset && t.dataset.endRcont !== undefined && ev === "change"){ END.f.rCont = t.dataset.endRcont; return endRender(); }
    const mapa = { "ee-marca":"marca", "ee-qtd":"qtd", "ee-lote":"lote", "ee-validade":"validade", "ee-obs":"obs", "er-qtd":"rQtd", "er-obs":"rObs" };
    if(mapa[id]){ END.f[mapa[id]] = t.value; return; }
    if(id === "er-local" && ev === "change"){ END.f.rLocal = t.value; END.f.rBalde = ""; END.f.rCont = ""; END.f.rQtd = ""; return endRender(); }
    if(id === "er-dest" && ev === "change"){ END.f.rDest = t.value; return endRender(); }
    if(id === "eb-q" && ev === "input"){ END.filtro.q = t.value; return endRenderFoco(id); }
    if(id === "eb-loc" && ev === "change"){ END.filtro.loc = t.value; return endRender(); }
    if(id === "ec-q" && ev === "input"){ END.f.cq = t.value; END.f.consDet = null; return endRenderFoco(id); }
    if((id === "ex-de" || id === "ex-ate") && ev === "change" && END.f.extrato){ END.f.extrato[id === "ex-de" ? "de" : "ate"] = t.value; return endRender(); }
    if(id === "er2-q" && ev === "input"){ END.f.rq = t.value; return endRenderFoco(id); }
    if(id === "eh-q" && ev === "input"){ END.f.hq = t.value; return endRenderFoco(id); }
    if(["eh-t","eh-de","eh-ate"].includes(id) && ev === "change"){ END.f[{ "eh-t":"ht", "eh-de":"hde", "eh-ate":"hate" }[id]] = t.value; return endRender(); }
    if(["hf-loc","hf-tipo","hf-de","hf-ate"].includes(id) && ev === "change"){ END.f[{ "hf-loc":"hfLoc", "hf-tipo":"hfTipo", "hf-de":"hfDe", "hf-ate":"hfAte" }[id]] = t.value; return endRender(); }
    if(id === "hf-cor" && ev === "input"){ END.f.hfCor = t.value; return endRenderFoco(id); }
  }



  // ---------- aparência (só neste aparelho) ----------
  const END_TEMAS = [["industrial","Industrial (igual ao VK Industrial)","#0E1013,#E85A28,#171A1F"],["claro","Claro — chão de fábrica","#f5f3ee,#d97706,#fff"],["azul","Azul","#eef4fb,#2563eb,#fff"],["verde","Verde","#f0f6f1,#15803d,#fff"],["roxo","Roxo","#f4f1fa,#7c3aed,#fff"],["grafite","Grafite e azul","#1c1f26,#0ea5e9,#262a33"]];
  const endTemaAtual = ()=>document.documentElement.dataset.tema || "industrial";
  function endAplicarTema(t){ document.documentElement.dataset.tema = t; try{ localStorage.setItem("end_tema", t); }catch(e){} const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#f5f3ee"; }
  function endTemasHtml(){ return endIcones(END_TEMAS.map(([k,n,c])=>`<button type="button" class="tema-op${endTemaAtual() === k ? " on" : ""}" data-end-tema="${k}"><i>${c.split(",").map(x=>`<s style="background:${x}"></s>`).join("")}</i><span>${n}</span>${endTemaAtual() === k ? '<span style="margin-left:auto;color:var(--amber);">✔</span>' : ""}</button>`).join("")); }
  function endCardAparencia(){ return `<div class="card"><div class="card-h"><h2>🎨 Aparência</h2></div><div class="sub">Escolha as cores do aplicativo. Vale só neste aparelho e não muda nada para os outros usuários.</div><div id="end-temas">${endTemasHtml()}</div></div>`; }
  const endTelaConfig0 = endTelaConfig;
  endTelaConfig = function(){ return endCardAparencia() + endTelaConfig0(); };
  document.addEventListener("click", e=>{
    const t = e.target.closest("[data-end-tema]"); if(t){ endAplicarTema(t.dataset.endTema); const b = document.getElementById("end-temas"); if(b) b.innerHTML = endTemasHtml(); const m = document.getElementById("tema-modal"); if(m){ m.querySelector("#tema-lista").innerHTML = endTemasHtml(); } return; }
    if(e.target.closest("#btn-tema") || e.target.closest("#btn-tema2")){ let m = document.getElementById("tema-modal"); if(!m){ m = document.createElement("div"); m.id = "tema-modal"; m.style.cssText = "position:fixed;inset:0;background:rgba(6,8,12,.66);backdrop-filter:blur(4px);z-index:9990;display:flex;align-items:center;justify-content:center;padding:16px;"; document.body.appendChild(m); } m.innerHTML = endIcones(`<div class="modal-box"><h2 style="margin:0 0 4px;">🎨 Aparência</h2><div class="sub">Vale só neste aparelho.</div><div id="tema-lista">${endTemasHtml()}</div><button type="button" class="btn grande" id="tema-fechar" style="margin-top:8px;">Pronto</button></div>`); m.style.display = "flex"; return; }
    if(e.target.closest("#tema-fechar") || e.target.id === "tema-modal"){ const m = document.getElementById("tema-modal"); if(m) m.style.display = "none"; }
  });
})();
</script></body></html>
